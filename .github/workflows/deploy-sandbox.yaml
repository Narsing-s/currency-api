name: MuleSoft CI/CD Pipeline

on:
  push:
    branches:
      - stg
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to CloudHub 2.0?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "no"

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:

    name: Build Mule Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Mule Application
        run: |
          mvn -B clean package \
            -DskipTests \
            -Dapp.name=currency-api \
            -Denvironment=Sandbox \
            -Dtarget="Shared Space"

      - name: Upload Mule Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-application
          path: target/*-mule-application.jar


  # ==========================================
  # DEPLOY STG
  # ==========================================
  deploy-stg:

    name: Deploy to STG

    needs: build

    if: |
      github.ref == 'refs/heads/stg' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.deploy == 'yes'
      )

    runs-on: ubuntu-latest

    environment:
      name: stg

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Deploy to CloudHub 2.0 - STG
        env:
          CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}

        run: |
          mvn -B clean deploy \
            -DmuleDeploy \
            -DskipTests \
            -Dapp.name=currency-api \
            -Denvironment=Sandbox \
            -Dtarget="Shared Space" \
            -DconnectedApp.clientId="${CLIENT_ID}" \
            -DconnectedApp.clientSecret="${CLIENT_SECRET}"


  # ==========================================
  # DEPLOY MAIN / PRODUCTION
  # ==========================================
  deploy-main:

    name: Deploy to CloudHub 2.0 - MAIN

    needs: build

    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.deploy == 'yes'
      )

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Deploy to CloudHub 2.0 - MAIN
        env:
          CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}

        run: |
          mvn -B clean deploy \
            -DmuleDeploy \
            -DskipTests \
            -Dapp.name=currency-api \
            -Denvironment=Sandbox \
            -Dtarget="Shared Space" \
            -DconnectedApp.clientId="${CLIENT_ID}" \
            -DconnectedApp.clientSecret="${CLIENT_SECRET}"
