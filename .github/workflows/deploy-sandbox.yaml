name: Deploy Mule API

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: 'Set to yes to deploy to CloudHub 2.0'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:
    name: Build Mule Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Mule application
        run: |
          mvn -B clean package \
            -DskipTests \
            -Dapp.name=bank-account-eapi \
            -Denvironment=Sandbox

      - name: Upload Mule artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-application
          path: target/*-mule-application.jar


  # ==========================================================
  # DEPLOY
  # ==========================================================
  deploy:
    name: Deploy to CloudHub 2.0
    needs: build

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'yes'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download Mule artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target

      - name: Deploy to CloudHub 2.0
        env:
          ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
          ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}

        run: |
          mvn -B deploy \
            -DmuleDeploy \
            -DskipTests \
            -Dapp.name=bank-account-eapi \
            -Denvironment=Sandbox \
            -Danypoint.username="${ANYPOINT_USERNAME}" \
            -Danypoint.password="${ANYPOINT_PASSWORD}"
